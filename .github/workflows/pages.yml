name: Publicar frontend en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Culturas/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Culturas/package-lock.json

      - name: Instalar dependencias
        working-directory: Culturas
        run: npm ci

      - name: Compilar para produccion
        working-directory: Culturas
        run: npx ng build --configuration production --base-href /icp-navega-raices-del-peru/

      - name: Preparar salida para Pages (SPA + sin Jekyll)
        run: |
          OUT=Culturas/dist/Culturas/browser
          touch "$OUT/.nojekyll"
          cp "$OUT/index.html" "$OUT/404.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Culturas/dist/Culturas/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
