services:
  - type: web
    name: icp-cultura-backend
    runtime: docker
    dockerfilePath: ./Cultura/Dockerfile
    dockerContext: ./Cultura
    plan: free
    envVars:
      - key: APP_NAME
        value: "ICP - Navega por las Raices del Peru"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://icp-cultura-backend.onrender.com
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Direccion del frontend ya publicado en GitHub Pages. Se usa para
      # armar el link que llega en los correos de "confirma tu cuenta" y
      # "restablecer contrasena".
      - key: FRONTEND_URL
        value: https://wifi21042.github.io/icp-navega-raices-del-peru
      # IMPORTANTE: Render bloquea las conexiones salientes por los puertos
      # de SMTP (25, 465, 587) en el plan gratis, asi que mandar correos
      # por Gmail/SMTP desde aqui nunca funciona (por eso el correo de
      # verificacion y el de restablecer contrasena no llegaban). La
      # solucion es mandar los correos por la API HTTP de Brevo
      # (brevo.com) en vez de SMTP. Instrucciones de como sacar esta clave
      # en el README, seccion "Version en vivo".
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "ICP - Navega por las Raices del Peru"
